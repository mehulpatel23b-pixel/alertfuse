[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alertfuse"
version = "0.1.0"
description = "Offline alert-stream fusion for SOC triage: collapse duplicate alerts from many tools into one explainable incident queue"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Harry Chavada" }]
keywords = ["security", "soc", "blue-team", "alert-fatigue", "triage", "incident-response", "dfir"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Logging",
]
dependencies = []

[project.scripts]
alertfuse = "alertfuse.cli:main"

[project.urls]
Homepage = "https://github.com/mehulpatel23b-pixel/alertfuse"
Issues = "https://github.com/mehulpatel23b-pixel/alertfuse/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
